name: Research validation finding
description: Record evidence about model validity, mapping behavior, or reproducibility.
title: "validation: "
labels: [research-validation, triage]
body:
  - type: markdown
    attributes:
      value: This tracker is for research evidence, not clinical advice. Never include patient data.
  - type: dropdown
    attributes:
      label: Evidence area
      options:
        - Reproducibility
        - Nosology mapping
        - Phenotype dimension
        - Calibration
        - External validation
        - Governance
    validations:
      required: true
  - type: textarea
    attributes:
      label: Claim under test
    validations:
      required: true
  - type: textarea
    attributes:
      label: Evidence and method
      description: Link a public protocol or describe a synthetic, de-identified, or approved dataset.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance criterion
    validations:
      required: true
