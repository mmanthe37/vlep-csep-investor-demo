name: Deploy Investor MVP to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/investor-demo/package-lock.json
      - name: Rebuild deterministic demo bundle
        run: python scripts/export_investor_demo.py
      - name: Publish governance documents with the site
        run: |
          mkdir -p apps/investor-demo/public/docs
          cp docs/RESEARCH_DISCLAIMER.md docs/MODEL_CARD.md docs/DATA_CARD.md apps/investor-demo/public/docs/
          cp SECURITY.md apps/investor-demo/public/
      - name: Build investor site
        working-directory: apps/investor-demo
        run: |
          npm ci
          npm run typecheck
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/investor-demo/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
