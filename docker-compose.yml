services:
  # ─── PostgreSQL 15 ────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: vlep-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vlep_db}
      POSTGRES_USER: ${POSTGRES_USER:-vlep}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - vlep_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vlep} -d ${POSTGRES_DB:-vlep_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres
        -c shared_preload_libraries='pg_stat_statements'
        -c max_connections=200
        -c work_mem=32MB
        -c maintenance_work_mem=256MB
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Redis (Celery broker + result backend) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: vlep-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - vlep_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Neo4j (Knowledge Graph) ─────────────────────────────────────────────
  neo4j:
    image: neo4j:5-community
    container_name: vlep-neo4j
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol
    volumes:
      - vlep_neo4j_data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── FastAPI Application ──────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    container_name: vlep-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vlep}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vlep_db}?ssl=require
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ─── Celery Worker (IO Bound) ──────────────────────────────────────────────
  worker-io:
    build:
      context: .
      target: production
    container_name: vlep-worker-io
    restart: unless-stopped
    command: ["celery", "-A", "vlep.tasks", "worker", "-Q", "io_bound,default", "--loglevel=info", "--concurrency=4"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vlep}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vlep_db}?ssl=require
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ─── Celery Worker (GPU/NLP Heavy) ────────────────────────────────────────
  worker-gpu:
    build:
      context: .
      target: production
    container_name: vlep-worker-gpu
    restart: unless-stopped
    command: ["celery", "-A", "vlep.tasks", "worker", "-Q", "gpu_heavy", "--loglevel=info", "--concurrency=1"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-vlep}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vlep_db}?ssl=require
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  vlep_pgdata:
    driver: local
  vlep_redis_data:
    driver: local
  vlep_neo4j_data:
    driver: local
